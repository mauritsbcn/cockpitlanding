<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Cockpit — UI kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100vh; background: #F7F9FC; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #0B2545; }
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0B2545">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0B2545"/>
    <g transform="translate(600 400)">
      <circle r="120" fill="none" stroke="#ffffff" stroke-width="10"/>
      <circle r="60" fill="#3A8FE0"/>
      <text x="0" y="240" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="64" letter-spacing="-1">Cockpit</text>
    </g>
  </svg>
</template>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel" src="Pages.jsx"></script>
<script type="text/babel" data-presets="env,react">
function App() {
  const [view, setView] = React.useState('app'); // 'login' | 'app'
  const [active, setActive] = React.useState('overzicht');
  const [mode, setMode] = React.useState('demo');
  const [period, setPeriod] = React.useState('maand');
  const [marketplace, setMarketplace] = React.useState('all');

  if (view === 'login') {
    return <LoginPage onSubmit={() => setView('app')} />;
  }

  const PageProps = { mode, setMode, period, setPeriod, marketplace, setMarketplace };
  let Page = OverzichtPage;
  if (active === 'orders') Page = OrdersPage;
  if (active === 'producten') Page = ProductenPage;
  if (active === 'financieel') Page = FinancieelPage;
  if (active === 'connecties') Page = ConnectiesPage;

  return (
    <div style={{ display: 'flex', minHeight: '100vh' }}>
      <Sidebar active={active} onNavigate={setActive} onLogout={() => setView('login')} />
      <Page {...PageProps} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
