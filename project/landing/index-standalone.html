<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit — Eén dashboard voor al je marketplaces</title>
<meta name="description" content="Multi-marketplace dashboard voor NL/BE e-commerce sellers. Bol, Amazon, Praxis en Shopify in één overzicht. Verkoop, ads en marges per kanaal.">

<link rel="stylesheet" href="colors_and_type.css">
<link rel="stylesheet" href="landing.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail" data-bg-color="#FFFFFF">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#FFFFFF"/>
    <rect x="120" y="200" width="520" height="22" rx="4" fill="#0B2545"/>
    <rect x="120" y="240" width="420" height="22" rx="4" fill="#3A8FE0"/>
    <rect x="120" y="320" width="320" height="14" rx="3" fill="#A0AEC0"/>
    <rect x="120" y="346" width="280" height="14" rx="3" fill="#A0AEC0"/>
    <rect x="120" y="410" width="160" height="44" rx="8" fill="#0B2545"/>
    <rect x="700" y="180" width="380" height="440" rx="14" fill="#F7F9FC" stroke="#E5EAF0" stroke-width="2"/>
    <rect x="720" y="220" width="80" height="40" rx="6" fill="#fff" stroke="#E5EAF0"/>
    <rect x="810" y="220" width="80" height="40" rx="6" fill="#fff" stroke="#E5EAF0"/>
    <rect x="900" y="220" width="80" height="40" rx="6" fill="#fff" stroke="#E5EAF0"/>
    <rect x="990" y="220" width="80" height="40" rx="6" fill="#fff" stroke="#E5EAF0"/>
    <rect x="720" y="290" width="350" height="160" rx="6" fill="#fff" stroke="#E5EAF0"/>
    <rect x="740" y="430" width="20" height="-100" fill="#0066B2"/>
    <rect x="780" y="430" width="20" height="-120" fill="#FF9900"/>
    <rect x="820" y="430" width="20" height="-80" fill="#00843D"/>
    <rect x="860" y="430" width="20" height="-110" fill="#5A8E3A"/>
  </svg>
</template>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="sections-top.jsx"></script>
<script type="text/babel" src="sections-bottom.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "lang": "nl",
  "accent": "blue",
  "heroLayout": "split",
  "showTrustStrip": true,
  "showFloatingCallouts": true
}/*EDITMODE-END*/;

const ACCENT_PRESETS = {
  blue:   { v500: '#3A8FE0', v50: '#EFF6FF' },
  green:  { v500: '#16A34A', v50: '#ECFDF5' },
  amber:  { v500: '#D97706', v50: '#FEF3C7' },
  navy:   { v500: '#1B3E6F', v50: '#EDF2F7' },
};

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply accent override
  React.useEffect(() => {
    const a = ACCENT_PRESETS[tweaks.accent] || ACCENT_PRESETS.blue;
    document.documentElement.style.setProperty('--cp-blue-500', a.v500);
    document.documentElement.style.setProperty('--cp-blue-50',  a.v50);
  }, [tweaks.accent]);

  // Hide floating callouts via class on body
  React.useEffect(() => {
    document.body.classList.toggle('lp-no-floats', !tweaks.showFloatingCallouts);
  }, [tweaks.showFloatingCallouts]);

  const handleDemo   = () => alert('Demo openen — placeholder');
  const handleIntake = () => alert('Intake plannen — placeholder');

  return (
    <React.Fragment>
      <Nav onDemo={handleDemo} onIntake={handleIntake} />
      <main>
        <Hero onDemo={handleDemo} onIntake={handleIntake} layout={tweaks.heroLayout} />
        {tweaks.showTrustStrip && <TrustStrip />}
        <ProblemSection />
        <FeatureSection />
        <HowItWorks />
        <Pricing onIntake={handleIntake} />
        <FAQ />
        <CTABlock onDemo={handleDemo} onIntake={handleIntake} />
      </main>
      <Footer />

      <TweaksPanel title="Cockpit landing">
        <TweakSection title="Brand">
          <TweakRadio label="Accentkleur" value={tweaks.accent}
            onChange={v => setTweak('accent', v)}
            options={[
              { value: 'blue',  label: 'Blauw' },
              { value: 'green', label: 'Groen' },
              { value: 'amber', label: 'Amber' },
              { value: 'navy',  label: 'Navy' },
            ]} />
        </TweakSection>
        <TweakSection title="Layout">
          <TweakToggle label="Trust-strip tonen"
            value={tweaks.showTrustStrip}
            onChange={v => setTweak('showTrustStrip', v)} />
          <TweakToggle label="Hero-callouts tonen"
            value={tweaks.showFloatingCallouts}
            onChange={v => setTweak('showFloatingCallouts', v)} />
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<style>
  body.lp-no-floats .lp-mock-callout { display: none; }
</style>

</body>
</html>
