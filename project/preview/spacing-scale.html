<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Cockpit · Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: grid; grid-template-columns: 70px 1fr 60px; gap: 12px; align-items: center; padding: 6px 0; }
  .label { font-size: 11px; font-family: var(--cp-font-mono); color: #4A5568; }
  .px { font-size: 10px; font-family: var(--cp-font-mono); color: #A0AEC0; text-align: right; }
  .bar { background: #0B2545; height: 14px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="row"><span class="label">space-1</span><div class="bar" style="width:4px"></div><span class="px">4 px</span></div>
  <div class="row"><span class="label">space-2</span><div class="bar" style="width:8px"></div><span class="px">8 px</span></div>
  <div class="row"><span class="label">space-3</span><div class="bar" style="width:12px"></div><span class="px">12 px</span></div>
  <div class="row"><span class="label">space-4</span><div class="bar" style="width:16px"></div><span class="px">16 px</span></div>
  <div class="row"><span class="label">space-5</span><div class="bar" style="width:20px"></div><span class="px">20 px</span></div>
  <div class="row"><span class="label">space-6</span><div class="bar" style="width:24px"></div><span class="px">24 px</span></div>
  <div class="row"><span class="label">space-8</span><div class="bar" style="width:32px"></div><span class="px">32 px</span></div>
  <div class="row"><span class="label">space-12</span><div class="bar" style="width:48px"></div><span class="px">48 px</span></div>
</body>
</html>
