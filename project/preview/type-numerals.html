<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Cockpit · Numerals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
  .num { font-size: 28px; font-weight: 700; color: #0B2545; letter-spacing: -.01em; }
  .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #718096; font-weight: 500; margin-bottom: 4px; }
  .hint { font-size: 11px; color: #A0AEC0; margin-top: 2px; }
  .pos { color: #16A34A; font-size: 11px; font-weight: 500; }
  .neg { color: #DC2626; font-size: 11px; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <div class="lbl">Bruto omzet</div>
      <div class="num">€124.580</div>
      <div class="pos">↑ 12,4%</div>
    </div>
    <div>
      <div class="lbl">Netto marge</div>
      <div class="num">18,2%</div>
      <div class="hint">vs vorige periode</div>
    </div>
    <div>
      <div class="lbl">ROAS</div>
      <div class="num">4,8×</div>
      <div class="pos">↑ 0,6×</div>
    </div>
    <div>
      <div class="lbl">TACoS</div>
      <div class="num">8,3%</div>
      <div class="neg">↑ 1,2%</div>
    </div>
  </div>
</body>
</html>
